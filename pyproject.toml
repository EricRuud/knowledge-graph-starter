[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-graph-starter"
version = "0.1.0"
description = "Markdown commitments, human validation, and explicit inference links"
requires-python = ">=3.11"
dependencies = ["python-frontmatter==1.1.0", "PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.16"]
mcp = ["mcp==1.26.0"]

[project.scripts]
kg = "knowledge_graph.cli:main"
kg-mcp = "knowledge_graph.mcp_server:main"

[tool.setuptools.packages.find]
include = ["knowledge_graph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
